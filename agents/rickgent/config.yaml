spec_version: 1

name: rickgent
description: >
  Rickgent — autonomous multi-model engineering platform.
  Combines Omnigent's multi-harness infrastructure with Pickle Rick's
  PRD-driven lifecycle and the Fable Operating Manual's epistemic discipline.

instructions: AGENTS.md

executor:
  type: omnigent
  config:
    harness: claude

llm:
  model: anthropic/claude-sonnet-4-20250514
  max_completion_tokens: 16384
  reasoning_effort: medium

interaction:
  conversational: true
  modalities:
    input: [text, image, file]
    output: [text]

# ToolManager registers the concrete sys_os_* implementations from this
# environment. Merely listing a sys_os_* name under tools.builtins is not a
# registration contract.
os_env:
  type: caller_process
  cwd: .
  # Current source-mounted Omnigent cannot start its helper inside the default
  # platform sandbox because that sandbox cannot import the mounted package.
  # Tool policy is therefore the active M2 boundary; process isolation lands
  # with the owned-resource/supervisor milestone.
  sandbox:
    type: none

tools:
  agents:
    - worker

# Policy ATTACHMENT (B4/C4). Attachment is expressed here, via the top-level
# `guardrails:` block — NOT `policy_modules` (a server-config module-allowlist,
# unrelated to bundle attachment). The effective attached set is read
# statically via `omnigent.spec.parser.parse(...).guardrails.policies`.
# Composition precedence is DENY > ASK > ALLOW; `None` = abstain.
guardrails:
  ask_timeout: 86400
  policies:
    # Omnigent builtin — bounds shell blast radius. gate_pushes=True keeps the
    # ASK-class approval gate on even an authenticated run-branch push. The
    # autonomous policy adds correlation; its ALLOW does not cancel this ASK.
    blast_radius:
      type: function
      function:
        path: omnigent.inner.nessie.policies.blast_radius
        arguments:
          gate_pushes: true
    scope_fence:
      type: function
      function:
        path: rickgent_policies.scope_fence
    completion_evidence:
      type: function
      function:
        path: rickgent_policies.completion_evidence
    convergence_gate:
      type: function
      function:
        path: rickgent_policies.convergence_gate
    subtract_before_add:
      type: function
      function:
        path: rickgent_policies.subtract_before_add
    cross_vendor_review:
      type: function
      function:
        path: rickgent_policies.cross_vendor_review
    autonomous_pr_flow:
      type: function
      function:
        path: rickgent_policies.autonomous_pr_flow
        arguments: {}

# Skills are auto-discovered from the skills/ directory.
# Listed here for explicit reference and documentation.
skills:
  - prd-refine
  - implement
  - citadel
  - szechuan
  - anatomy-park
  - cronenberg
  - cross-review

params:
  # FOM disciplines baked into platform defaults
  fom_calibrated: true
  # Circuit breaker defaults (ported from pickle_settings.json)
  silent_death_respawn_cap: 1
  failed_flip_suppression_cap: 2
  bounded_terminal_escape_cap: 3
  breaker_thresholds: 5
  breaker_recovery_grace_seconds: 30
  # Worker timeout (seconds) — rickgent-side enforcement
  worker_timeout: 1200
  # Max concurrent workers (v0.1 backpressure)
  max_concurrent_workers: 2
