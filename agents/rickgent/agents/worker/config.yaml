spec_version: 1

name: worker
description: >
  Rickgent worker sub-agent. Dispatched as an `omnigent run` one-shot
  for a single lifecycle phase. Receives ticket scope and phase instructions
  via the prompt.

instructions: |
  You are a Rickgent worker. You execute a single lifecycle phase for a ticket.
  Work only within the declared paths for the ticket. Do not modify files
  outside your declared scope. Use only the structured read, write, and edit
  tools. Do not stage or commit changes, mutate Git refs, or run Git mutation
  commands. Never claim completion, a terminal state, delivery, or Done. The
  orchestrator will inspect the nonterminal working-tree delta after you exit.

executor:
  type: omnigent
  config:
    harness: claude

llm:
  model: anthropic/claude-sonnet-4-20250514
  max_completion_tokens: 16384

interaction:
  conversational: false
  modalities:
    input: [text]
    output: [text]

tools:
  # A-SEC-3 decision (architecture §6.2 option a): the worker drops the ad-hoc
  # raw-shell write capability. All writes route through structured
  # read/write/edit tools whose concrete target the attached `scope_fence`
  # can positively resolve and scope-check; an unresolved shell write would
  # otherwise DENY (fail closed). `sys_os_read` is read-only and stays.
  builtins:
    - sys_os_read
    - sys_os_write
    - sys_os_edit

# Policy ATTACHMENT (B4/C4). The worker executes scoped structured writes, so it
# carries the required policy set — attached here via the
# top-level `guardrails:` block (NOT `policy_modules`). The effective attached
# set is read statically via `omnigent.spec.parser.parse(...).guardrails.policies`.
# Composition precedence is DENY > ASK > ALLOW; `None` = abstain.
guardrails:
  ask_timeout: 86400
  policies:
    # Omnigent builtin retained for defense in depth. The worker has no raw
    # shell tool and its instructions forbid Git mutation or delivery.
    blast_radius:
      type: function
      function:
        path: omnigent.inner.nessie.policies.blast_radius
        arguments:
          gate_pushes: true
    scope_fence:
      type: function
      function:
        path: rickgent_policies.scope_fence
    completion_evidence:
      type: function
      function:
        path: rickgent_policies.completion_evidence
    convergence_gate:
      type: function
      function:
        path: rickgent_policies.convergence_gate
    subtract_before_add:
      type: function
      function:
        path: rickgent_policies.subtract_before_add
    cross_vendor_review:
      type: function
      function:
        path: rickgent_policies.cross_vendor_review
    autonomous_pr_flow:
      type: function
      function:
        path: rickgent_policies.autonomous_pr_flow
