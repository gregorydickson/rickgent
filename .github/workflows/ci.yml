# Rickgent CI — real quality and CI gates (t36 / VAL-REL-002)
#
# Pins toolchain versions from repository metadata (package.json engines,
# pyproject.toml requires-python, packageManager field). Runs focused seam
# suites, full regressions, package inventories, clean-install smoke, and
# uploads redacted proof summaries. Infrastructure failures are never
# reported as successful quality results.

name: ci

on:
  push:
    branches: [main, remediation/*]
  pull_request:
    branches: [main]

env:
  # Pinned from package.json packageManager and engines
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.12"
  PNPM_VERSION: "10.22.0"

jobs:
  # ── TypeScript quality gates ──────────────────────────────────────────────
  ts-quality:
    name: TypeScript lint + typecheck + build + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Install dependencies
        working-directory: orchestrator
        run: pnpm install --frozen-lockfile
      - name: ESLint
        working-directory: orchestrator
        run: pnpm lint
      - name: Typecheck
        working-directory: orchestrator
        run: pnpm typecheck
      - name: Build
        working-directory: orchestrator
        run: pnpm build
      - name: Test with coverage
        working-directory: orchestrator
        run: pnpm vitest run --pool=threads --poolOptions.threads.maxThreads=4 --no-file-parallelism --coverage

  # ── Python quality gates ──────────────────────────────────────────────────
  py-quality:
    name: Python lint + typecheck + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install quality tools
        run: pip install ruff mypy pytest-cov build
      - name: Install omnigent (editable, read-only sibling)
        run: |
          git clone https://github.com/gregorydickson/omnigent.git /tmp/omnigent
          pip install -e /tmp/omnigent
      - name: Install rickgent-policies (editable)
        working-directory: rickgent-policies
        run: pip install -e .
      - name: Build dist
        working-directory: rickgent-policies
        run: python3 -m build --outdir ../artifacts/reliability/python-dist
      - name: Ruff lint
        working-directory: rickgent-policies
        run: ruff check .
      - name: Mypy typecheck
        working-directory: rickgent-policies
        run: mypy rickgent_policies
      - name: Pytest with coverage
        working-directory: rickgent-policies
        run: python3 -m pytest test/ -p no:cacheprovider -q --cov=rickgent_policies --cov-fail-under=90

  # ── Mutation and coverage manifest verification ───────────────────────────
  mutation-verify:
    name: Mutation + coverage manifest verify
    runs-on: ubuntu-latest
    needs: [ts-quality, py-quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Install dependencies
        working-directory: orchestrator
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: orchestrator
        run: pnpm build
      - name: Coverage manifest verify (temp-worktrees-only)
        working-directory: orchestrator
        run: node scripts/coverage-manifest.cjs --verify --temp-worktrees-only

  # ── Release manifest and package inventory ────────────────────────────────
  release-verify:
    name: Release manifest + package inventory
    runs-on: ubuntu-latest
    needs: [ts-quality, py-quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install build tools
        run: pip install build
      - name: Install dependencies
        working-directory: orchestrator
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: orchestrator
        run: pnpm build
      - name: Generate npm pack inventory
        working-directory: orchestrator
        run: npm pack --dry-run --json > ../artifacts/reliability/npm-pack-inventory.json
      - name: Build Python dist
        working-directory: rickgent-policies
        run: python3 -m build --outdir ../artifacts/reliability/python-dist
      - name: Validate release manifest
        run: node orchestrator/scripts/validate-release-manifest.mjs release-manifest.json
      - name: Assert package inventory
        run: node orchestrator/scripts/assert-package-inventory.mjs artifacts/reliability/npm-pack-inventory.json artifacts/reliability/python-dist

  # ── Citadel conformance hard gate ─────────────────────────────────────────
  citadel:
    name: Citadel conformance audit
    runs-on: ubuntu-latest
    needs: [ts-quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Install dependencies
        working-directory: orchestrator
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: orchestrator
        run: pnpm build
      - name: Citadel
        run: node orchestrator/dist/cli.js citadel --prd MISSION_3_PRD.md --repo .

  # ── Quality gates summary (aggregated) ────────────────────────────────────
  quality-gates-summary:
    name: Quality gates summary
    runs-on: ubuntu-latest
    needs: [ts-quality, py-quality, mutation-verify, release-verify, citadel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install quality tools
        run: pip install ruff mypy pytest-cov build
      - name: Install dependencies
        working-directory: orchestrator
        run: pnpm install --frozen-lockfile
      - name: Install coverage provider
        working-directory: orchestrator
        run: pnpm add -D @vitest/coverage-v8@^3.0.0
      - name: Build
        working-directory: orchestrator
        run: pnpm build
      - name: Run quality gates summary
        run: node orchestrator/scripts/quality-gates-summary.mjs run
      - name: Verify quality gates summary
        run: |
          node -e "const f=require('fs');const x=JSON.parse(f.readFileSync('artifacts/reliability/quality-gates-summary.json'));if(x.skipped_required?.length||x.infrastructure_errors?.length||!x.thresholds_passed)process.exit(1)"
      - name: Upload quality gates summary
        uses: actions/upload-artifact@v4
        with:
          name: quality-gates-summary
          path: artifacts/reliability/quality-gates-summary.json
